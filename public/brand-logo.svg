<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003DA5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Main M shape with checkmarks -->
  <g stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left side of M -->
    <path d="M 45 160 L 45 80 L 75 110"/>
    
    <!-- Right side of M -->
    <path d="M 75 110 L 105 80 L 105 160"/>
    
    <!-- Center checkmark -->
    <path d="M 95 120 L 110 135 L 140 105" opacity="0.7"/>
    
    <!-- Right section -->
    <path d="M 125 160 L 125 80 L 155 110"/>
    <path d="M 155 110 L 155 160"/>
  </g>
  
  <!-- Accent checkmarks -->
  <g stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="55" cy="70" r="6" stroke-width="2"/>
    <circle cx="145" cy="70" r="6" stroke-width="2"/>
  </g>
  
  <!-- Checkmark accent -->
  <g stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 75 90 L 85 100 L 100 85"/>
    <path d="M 130 90 L 140 100 L 155 85"/>
  </g>
</svg>